# fxbot's release install: the app, its database, and the local embedder for memory search. setup.sh puts this file in
# /opt/fxbot beside an .env that sets FXBOT_VERSION, FXBOT_UID and FXBOT_GID (the fxbot user's), FXBOT_DB_PASSWORD,
# FXBOT_ENGINE, and FXBOT_EMBEDDER. The fxbot command there runs it, with the embedder's profile on unless
# FXBOT_EMBEDDER is off, and a GPU file (compose.gpu.<engine>.yaml) when it's gpu. FXBOT_ROOT puts the machine's
# folders under another root, for checks.
name: fxbot
services:
  fxbot:
    image: ${FXBOT_IMAGE:-ghcr.io/iammrduncan/fxbot}:${FXBOT_VERSION:?set FXBOT_VERSION}
    user: "${FXBOT_UID:?set FXBOT_UID}:${FXBOT_GID:?set FXBOT_GID}"
    env_file: [ "${FXBOT_ROOT:-}/etc/fxbot/fxbot.env" ]
    environment:
      FXBOT_DATABASE_URL: postgres://fxbot:${FXBOT_DB_PASSWORD:?set FXBOT_DB_PASSWORD}@db/fxbot
      FXBOT_SECRET_KEY_FILE: /run/secrets/fxbot_key
      FXBOT_DATA: /var/lib/fxbot/data
      FXBOT_BACKUPS: /var/lib/fxbot/backups
      FXBOT_CONTROL: /var/lib/fxbot/control
      FXBOT_EMBED_URL: http://embed:8080/v1
    secrets: [fxbot_key]
    volumes:
      - ${FXBOT_ROOT:-}/var/lib/fxbot/data:/var/lib/fxbot/data
      - ${FXBOT_ROOT:-}/var/lib/fxbot/backups:/var/lib/fxbot/backups
      - ${FXBOT_ROOT:-}/var/lib/fxbot/control:/var/lib/fxbot/control
    # The machine's loopback only, as fxbot always listened. Tailscale or a proxy reaches it there.
    ports: [ "127.0.0.1:${FXBOT_PORT:-8787}:8787" ]
    depends_on:
      db: { condition: service_healthy }
    healthcheck: { test: [ CMD, fxbot-health ], interval: 3s, timeout: 2s, retries: 3 }
    # Running chats finish before it stops, as they did under systemd.
    stop_grace_period: 90s
    restart: unless-stopped
  # Reached only by the app, by its name: no port on the machine.
  db:
    image: docker.io/pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: fxbot
      POSTGRES_DB: fxbot
      POSTGRES_PASSWORD: ${FXBOT_DB_PASSWORD:?set FXBOT_DB_PASSWORD}
    volumes: [ pgdata:/var/lib/postgresql/data ]
    # Over TCP: during its first start the database answers on its socket before it's ready.
    healthcheck: { test: [ CMD, pg_isready, -h, 127.0.0.1, -U, fxbot, -d, fxbot ], interval: 3s }
    stop_grace_period: 1m
    restart: unless-stopped
  # Vectors for memory search: llama.cpp's server with EmbeddingGemma 2 on the CPU, which it downloads into `models` on
  # its first start. It yields the CPU to everything else, and the app doesn't wait for it.
  embed:
    profiles: [ embed ]
    image: ghcr.io/ggml-org/llama.cpp:server-b12033
    command: [ --embeddings, -hf, "ggml-org/embeddinggemma-2-GGUF:Q8_0", --no-mmproj, -c, "8192", -b, "2048", -ub, "2048", --no-webui, --host, 0.0.0.0, --port, "8080" ]
    environment:
      LLAMA_CACHE: /models
    volumes: [ models:/models ]
    cpu_shares: 256
    healthcheck: { test: [ CMD, curl, -fs, "http://localhost:8080/health" ], interval: 10s, start_period: 10m }
    restart: unless-stopped
secrets:
  fxbot_key: { file: "${FXBOT_ROOT:-}/etc/fxbot/secret.key" }
volumes:
  pgdata: {}
  models: {}
