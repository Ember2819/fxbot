name: release

# A release is a version in package.json that has no tag yet, on main. It is tagged and published only after it
# typechecks and builds, and its image is on ghcr.io, with docs/releases/<version>.md as the notes; a version such as
# 0.3.0-rc.1 is published as a prerelease. Every other push to main does nothing, and release branches, where work
# happens, never run it.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          release=true
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is released already."
            release=false
          fi
          { echo "release=$release"; echo "tag=$tag"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Typecheck and build
        if: steps.version.outputs.release == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Shipped migrations never change
        if: steps.version.outputs.release == 'true'
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          [ -n "$previous" ] || exit 0
          changed=$(git diff --name-status "$previous" HEAD -- packages/sdk/src/migrations/ | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "These migrations shipped in $previous, and must not change. Add a new one instead:"
            echo "$changed"
            exit 1
          fi

      - name: Read the notes
        id: notes
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          notes=docs/releases/$version.md
          if ! grep -Eq "^## $version( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi
          if [ "$(head -n 1 "$notes" 2>/dev/null)" != "fxbot $TAG is out!" ]; then
            echo "$notes must exist, and open with: fxbot $TAG is out!"
            exit 1
          fi
          { echo "notes<<FXBOT_NOTES"; printf '%s\n' "$(cat "$notes")"; echo "FXBOT_NOTES"; } >> "$GITHUB_OUTPUT"

  # fxbot's image for amd64 and arm64, tagged x.y.z, x.y, and latest for a stable version. The page is built on the
  # runner's own CPU (see the Dockerfile), so QEMU runs only the last stage's apt-get.
  image:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.tag }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Settings offers a release only once its image is there.
  publish:
    needs: [check, image]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" "${flags[@]}"
